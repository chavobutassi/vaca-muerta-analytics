name: Actualizar datos Vaca Muerta

on:
  schedule:
    - cron: '0 6 * * 1'   # Cada lunes 6am UTC (3am Argentina)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Clonar repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tqdm openpyxl scipy

      - name: Verificar archivos
        run: |
          echo "Archivos del repositorio:"
          ls -la
          echo ""
          echo "Archivos Python:"
          ls -la *.py

      - name: Correr pipeline
        run: |
          python vaca_muerta_pipeline.py

      - name: Validar registro de activos
        run: |
          python validacion_activos.py

      - name: Commit y push de datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/

          if git diff --staged --quiet; then
            echo "No hay cambios para actualizar."
          else
            git commit -m "datos: actualización automática $(date '+%Y-%m-%d')"
            git push
          fi
