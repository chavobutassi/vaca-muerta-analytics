name: Actualizar datos Vaca Muerta

on:
  schedule:
    # La fuente oficial responde de forma intermitente desde los runners de
    # GitHub, así que se intenta en varias ventanas (lunes y martes). La
    # primera corrida que logre bajar datos frescos commitea; el resto no
    # encuentra cambios y no hace nada.
    - cron: '17 6 * * 1'    # lunes 06:17 UTC (~03:17 ART)
    - cron: '17 14 * * 1'   # lunes 14:17 UTC (~11:17 ART)
    - cron: '17 20 * * 1'   # lunes 20:17 UTC (~17:17 ART) — ventana que funcionó antes
    - cron: '17 14 * * 2'   # martes 14:17 UTC (respaldo)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:

      - name: Clonar repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests tqdm openpyxl scipy

      - name: Verificar archivos
        run: |
          echo "Archivos del repositorio:"
          ls -la
          echo ""
          echo "Archivos Python:"
          ls -la *.py

      - name: Correr pipeline (hasta 3 intentos)
        run: |
          for i in 1 2 3; do
            echo "Intento $i de 3"
            if python vaca_muerta_pipeline.py; then
              exit 0
            fi
            echo "Falló el intento $i; espero 120 s antes de reintentar"
            sleep 120
          done
          echo "El pipeline falló en los 3 intentos"
          exit 1

      - name: Validar registro de activos
        continue-on-error: true
        run: |
          python validacion_activos.py

      - name: Commit y push de datos actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/data/

          if git diff --staged --quiet; then
            echo "No hay cambios para actualizar."
          else
            git commit -m "datos: actualización automática $(date '+%Y-%m-%d')"
            git push
          fi

      # Solo avisa si falla la última ventana (martes, respaldo), para no
      # generar ruido por las fallas esperables de las primeras ventanas.
      - name: Abrir issue si falla la última ventana
        if: failure() && github.event.schedule == '17 14 * * 2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Falló la actualización semanal de datos ($(date '+%Y-%m-%d'))" \
            --body "Fallaron todas las ventanas de esta semana. Ver el run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
